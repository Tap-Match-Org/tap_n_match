<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap & Match - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f3efe7;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-strong: #ffffff;
            --line: #d7d1c6;
            --text: #222222;
            --muted: #6b6258;
            --accent: #0f7b6c;
            --accent-strong: #0b5e53;
            --accent-soft: #d9f3ee;
            --danger: #d14b3d;
            --warning-bg: #fff2c2;
            --warning-text: #725600;
            --success-bg: #d7f1dd;
            --success-text: #1a6a37;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(15, 123, 108, 0.18), transparent 28%),
                linear-gradient(180deg, #f9f4ea 0%, #f1ebdf 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1700px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            background: linear-gradient(135deg, #114b5f 0%, #0f7b6c 58%, #e6b655 100%);
            color: white;
            padding: 32px;
            border-radius: 18px;
            margin-bottom: 28px;
            box-shadow: 0 18px 40px rgba(17, 75, 95, 0.18);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .header-content {
            flex: 1;
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.92;
            font-size: 16px;
        }

        .logout-button {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 999px;
            padding: 10px 18px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(34, 34, 34, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-left: 6px solid var(--accent);
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent-strong);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(15, 123, 108, 0.15);
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 24px;
            border: none;
            background: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            font-size: 16px;
            border-radius: 999px;
            transition: all 0.3s ease;
            color: var(--muted);
        }

        .tab-button.active {
            color: white;
            background: var(--accent);
        }

        .tab-button:hover {
            color: var(--accent);
        }

        .table-container {
            background: var(--surface);
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(34, 34, 34, 0.08);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(15, 123, 108, 0.08);
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        tr:hover {
            background: rgba(15, 123, 108, 0.04);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .status-approved {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status-rejected {
            background: #f8d8d5;
            color: #7b2e25;
        }

        .status-open {
            background: #ddf0fb;
            color: #14597e;
        }

        .status-closed {
            background: #ebe6de;
            color: #554a3f;
        }

        .status-banned {
            background: #f8d8d5;
            color: #7b2e25;
        }

        .status-active {
            background: var(--success-bg);
            color: var(--success-text);
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-strong);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #b63b2f;
        }

        .btn-secondary {
            background: #e5ddd0;
            color: #4f473d;
        }

        .btn-secondary:hover {
            background: #d6cbbb;
        }

        .alert {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #f8d8d5;
            color: #7b2e25;
            border: 1px solid #efb7b0;
        }

        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #b7dec3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: var(--muted);
        }

        .auth-section {
            background: var(--surface);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(34, 34, 34, 0.08);
            max-width: 400px;
            margin: 0 auto;
        }

        .auth-section h2 {
            margin-bottom: 20px;
            color: var(--accent-strong);
        }

        .auth-steps {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .auth-steps span {
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            background: #ece6dc;
            color: var(--muted);
        }

        .auth-steps .is-active {
            background: var(--accent);
            color: white;
        }

        .auth-steps .is-done {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .auth-page {
            display: grid;
            gap: 14px;
        }

        .page-note {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(15, 123, 108, 0.06);
            color: var(--accent-strong);
            border: 1px solid rgba(15, 123, 108, 0.12);
            font-size: 13px;
            line-height: 1.4;
        }

        .auth-actions {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .auth-actions .btn-primary,
        .auth-actions .btn-secondary {
            flex: 1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        .form-group input,
        .form-group select,
        .toolbar-form input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-group input:focus,
        .form-group select:focus,
        .toolbar-form input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 123, 108, 0.15);
        }

        .action-cell {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reason-text {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dashboard-shell {
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(360px, 1fr);
            gap: 24px;
            align-items: start;
        }

        .dashboard-main,
        .dashboard-side {
            min-width: 0;
        }

        .overview-grid,
        .detail-stack,
        .tab-panel {
            display: grid;
            gap: 18px;
        }

        .panel-card {
            background: var(--surface);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 24px rgba(34, 34, 34, 0.08);
            padding: 20px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .panel-header h3 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .panel-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .stack-list {
            display: grid;
            gap: 12px;
        }

        .compact {
            gap: 10px;
        }

        .list-card {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.75);
            text-align: left;
            width: 100%;
        }

        .list-card.static {
            cursor: default;
        }

        .list-card p,
        .list-card small {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            line-height: 1.4;
        }

        .list-title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .attention-grid,
        .split-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .detail-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }

        .metric-card {
            background: rgba(15, 123, 108, 0.06);
            border: 1px solid rgba(15, 123, 108, 0.1);
            border-radius: 14px;
            padding: 14px;
        }

        .metric-card span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .metric-card strong {
            display: block;
            line-height: 1.4;
        }

        .mini-list {
            display: grid;
            gap: 8px;
            color: var(--muted);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background: var(--accent-soft);
            color: var(--accent-strong);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .achievement-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
            max-height: 300px;
            overflow: auto;
            padding-right: 4px;
        }

        .achievement-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.72);
        }

        .achievement-item span {
            color: var(--muted);
            font-size: 13px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-form {
            display: flex;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .toolbar-form input {
            flex: 1 1 260px;
        }

        .empty-state {
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 14px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.55);
        }

        .empty-state.inline {
            padding: 10px 12px;
        }

        .link-button {
            background: none;
            padding: 0;
            color: var(--accent-strong);
            text-decoration: underline;
            font-weight: 600;
        }

        @media (max-width: 1100px) {
            .dashboard-shell {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .container {
                padding: 16px;
            }

            header {
                padding: 24px;
                flex-direction: column;
                align-items: flex-start;
            }

            .logout-button {
                margin-top: 16px;
            }

            .panel-header,
            .list-title,
            .achievement-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        .status-online {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }

        .online-indicator-dot {
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid white;
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
        }

        .highlight-online {
            border-top: 4px solid #4CAF50 !important;
        }

        .highlight-online .number {
            color: #2e7d32 !important;
        }
        .clickable-row {
            cursor: pointer;
            transition: background 0.2s;
        }

        .clickable-row:hover {
            background: rgba(15, 123, 108, 0.08) !important;
        }

        .selected-row {
            background: rgba(15, 123, 108, 0.12) !important;
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .link-text {
            color: var(--accent-strong);
            font-weight: 600;
            text-decoration: underline;
        }

        .btn-icon-only {
            padding: 4px 8px;
            min-width: 32px;
            font-size: 12px;
        }
        .collapsible .panel-header {
            user-select: none;
            transition: background 0.2s;
            margin-bottom: 0;
            padding-bottom: 12px;
        }

        .collapsible .panel-header:hover {
            opacity: 0.8;
        }

        .is-expanded .panel-content {
            padding-top: 16px;
            border-top: 1px solid var(--line);
            margin-top: 12px;
        }

        .collapse-icon {
            font-size: 12px;
            margin-left: 8px;
            color: var(--muted);
            vertical-align: middle;
        }

        .achievement-list-dashboard {
            display: grid;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .inventory-scroll-container {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .timeline-scroll-container {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .overview-scroll-container {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .achievement-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--line);
            border-radius: 12px;
            transition: all 0.2s;
        }

        .achievement-item.is-unlocked {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .ach-main {
            flex: 1;
        }

        .ach-main strong {
            display: block;
            font-size: 14px;
        }

        .ach-main p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .ach-status {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }

        .ach-status small {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
        }
        .inventory-v3 {
            display: grid;
            gap: 24px;
        }

        .equipped-panel {
            background: rgba(15, 123, 108, 0.04);
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(15, 123, 108, 0.1);
        }

        .equipped-panel h4 {
            margin-bottom: 20px;
            color: var(--accent-strong);
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 2px solid rgba(15, 123, 108, 0.1);
            padding-bottom: 10px;
        }

        .eq-stack {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .eq-box {
            background: white;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 96px;
            word-break: break-word;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
        }

        .eq-head {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }

        .eq-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: rgba(15, 123, 108, 0.08);
            border: 1px solid rgba(15, 123, 108, 0.12);
        }

        .eq-copy {
            display: grid;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .eq-label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .eq-val {
            font-size: 14px;
            color: var(--text);
            line-height: 1.3;
            font-weight: 600;
        }

        .eq-meta {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.4;
        }

        .unlocked-panel {
            display: grid;
            gap: 20px;
        }

        .un-group h4 {
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
            padding-bottom: 4px;
        }

        .inventory-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .inventory-item {
            background: white;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 10px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.025);
        }

        .inventory-item .eq-head {
            gap: 10px;
            align-items: center;
        }

        .inventory-item .eq-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .inventory-item .eq-copy {
            gap: 2px;
        }

        .inventory-item .eq-label {
            font-size: 10px;
            letter-spacing: 0.04em;
        }

        .inventory-item .eq-val {
            font-size: 13px;
            line-height: 1.2;
        }

        .inventory-item .eq-meta {
            font-size: 11px;
            line-height: 1.25;
        }

        .inventory-item .btn-icon-only {
            min-width: 0;
            padding: 4px 7px;
            font-size: 11px;
            border-radius: 7px;
        }

        @media (max-width: 720px) {
            .inventory-list {
                grid-template-columns: 1fr;
            }
        }

        .theme-preview-wrapper {
            position: relative;
            cursor: help;
            display: inline-grid;
            gap: 4px;
            min-width: 0;
        }

        .theme-floating-preview {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            border: 1px solid var(--line);
            z-index: 2000;
            pointer-events: none;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .theme-floating-preview .color-box {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .theme-floating-preview .image-preview {
            max-width: 220px;
            max-height: 140px;
            border-radius: 10px;
            display: block;
            object-fit: cover;
        }

        .btn-icon-only {
            padding: 4px 8px;
            min-width: 32px;
            font-size: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--line);
            overflow: hidden;
        }

        .modal-content.large {
            max-width: 1200px;
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
