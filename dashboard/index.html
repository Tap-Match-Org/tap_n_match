<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap & Match - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f3efe7;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-strong: #ffffff;
            --line: #d7d1c6;
            --text: #222222;
            --muted: #6b6258;
            --accent: #0f7b6c;
            --accent-strong: #0b5e53;
            --accent-soft: #d9f3ee;
            --danger: #d14b3d;
            --warning-bg: #fff2c2;
            --warning-text: #725600;
            --success-bg: #d7f1dd;
            --success-text: #1a6a37;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(15, 123, 108, 0.18), transparent 28%),
                linear-gradient(180deg, #f9f4ea 0%, #f1ebdf 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1700px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            position: relative;
            background: linear-gradient(135deg, #114b5f 0%, #0f7b6c 58%, #e6b655 100%);
            color: white;
            padding: 32px;
            border-radius: 18px;
            margin-bottom: 28px;
            box-shadow: 0 18px 40px rgba(17, 75, 95, 0.18);
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.92;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(34, 34, 34, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-left: 6px solid var(--accent);
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent-strong);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(15, 123, 108, 0.15);
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 24px;
            border: none;
            background: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            font-size: 16px;
            border-radius: 999px;
            transition: all 0.3s ease;
            color: var(--muted);
        }

        .tab-button.active {
            color: white;
            background: var(--accent);
        }

        .tab-button:hover {
            color: var(--accent);
        }

        .table-container {
            background: var(--surface);
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(34, 34, 34, 0.08);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(15, 123, 108, 0.08);
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        tr:hover {
            background: rgba(15, 123, 108, 0.04);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .status-approved {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status-rejected {
            background: #f8d8d5;
            color: #7b2e25;
        }

        .status-open {
            background: #ddf0fb;
            color: #14597e;
        }

        .status-closed {
            background: #ebe6de;
            color: #554a3f;
        }

        .status-banned {
            background: #f8d8d5;
            color: #7b2e25;
        }

        .status-active {
            background: var(--success-bg);
            color: var(--success-text);
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-strong);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #b63b2f;
        }

        .btn-secondary {
            background: #e5ddd0;
            color: #4f473d;
        }

        .btn-secondary:hover {
            background: #d6cbbb;
        }

        .alert {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #f8d8d5;
            color: #7b2e25;
            border: 1px solid #efb7b0;
        }

        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #b7dec3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: var(--muted);
        }

        .auth-section {
            background: var(--surface);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(34, 34, 34, 0.08);
            max-width: 400px;
            margin: 0 auto;
        }

        .auth-section h2 {
            margin-bottom: 20px;
            color: var(--accent-strong);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        .form-group input,
        .toolbar-form input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-group input:focus,
        .toolbar-form input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 123, 108, 0.15);
        }

        .action-cell {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reason-text {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dashboard-shell {
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(360px, 1fr);
            gap: 24px;
            align-items: start;
        }

        .dashboard-main,
        .dashboard-side {
            min-width: 0;
        }

        .overview-grid,
        .detail-stack,
        .tab-panel {
            display: grid;
            gap: 18px;
        }

        .panel-card {
            background: var(--surface);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 24px rgba(34, 34, 34, 0.08);
            padding: 20px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .panel-header h3 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .panel-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .stack-list {
            display: grid;
            gap: 12px;
        }

        .compact {
            gap: 10px;
        }

        .list-card {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.75);
            text-align: left;
            width: 100%;
        }

        .list-card.static {
            cursor: default;
        }

        .list-card p,
        .list-card small {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            line-height: 1.4;
        }

        .list-title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .attention-grid,
        .split-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .detail-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }

        .metric-card {
            background: rgba(15, 123, 108, 0.06);
            border: 1px solid rgba(15, 123, 108, 0.1);
            border-radius: 14px;
            padding: 14px;
        }

        .metric-card span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .metric-card strong {
            display: block;
            line-height: 1.4;
        }

        .mini-list {
            display: grid;
            gap: 8px;
            color: var(--muted);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background: var(--accent-soft);
            color: var(--accent-strong);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .achievement-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
            max-height: 300px;
            overflow: auto;
            padding-right: 4px;
        }

        .achievement-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.72);
        }

        .achievement-item span {
            color: var(--muted);
            font-size: 13px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-form {
            display: flex;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .toolbar-form input {
            flex: 1 1 260px;
        }

        .empty-state {
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 14px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.55);
        }

        .empty-state.inline {
            padding: 10px 12px;
        }

        .link-button {
            background: none;
            padding: 0;
            color: var(--accent-strong);
            text-decoration: underline;
            font-weight: 600;
        }

        .logout-button {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 999px;
            padding: 10px 18px;
        }

        @media (max-width: 1100px) {
            .dashboard-shell {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .container {
                padding: 16px;
            }

            header {
                padding: 24px;
            }

            .logout-button {
                position: static;
                margin-top: 16px;
            }

            .panel-header,
            .list-title,
            .achievement-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="root"></div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
</body>
</html>
